name: Dependency vulnerability scan
on:
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0 # not bumped by Dependabot — recheck when trivy-action updates
          scan-type: fs
          scan-ref: .
          scanners: vuln
          # the artifact resolves deps via the ROOT yarn.lock (workspace);
          # the submodule's own lockfile only serves upstream standalone builds
          skip-files: contrib/fhir-emr/yarn.lock
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
