name: Build seeds image
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  Release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0 # not bumped by Dependabot — recheck when trivy-action updates
          scan-type: fs
          scan-ref: .
          scanners: vuln
          # the artifact resolves deps via the ROOT yarn.lock (workspace);
          # the submodule's own lockfile only serves upstream standalone builds
          skip-files: contrib/fhir-emr/yarn.lock
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Setup Docker builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to Docker registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lowercase github.repository
        run: |
          echo "IMAGE_NAME=`echo ${{github.repository}} | tr '[:upper:]' '[:lower:]'`" >>${GITHUB_ENV}
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/tags/v})" >>$GITHUB_OUTPUT
        id: extract_branch
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: resources
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-seeds:scan
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0 # not bumped by Dependabot — recheck when trivy-action updates
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-seeds:scan
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Build and push the Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: resources
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-seeds:${{ steps.extract_branch.outputs.branch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-seeds:latest
      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0 # not bumped by Dependabot — recheck when trivy-action updates
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-seeds:scan
          format: cyclonedx
          output: sbom-seeds.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-seeds-${{ steps.extract_branch.outputs.branch }}
          path: sbom-seeds.cdx.json
